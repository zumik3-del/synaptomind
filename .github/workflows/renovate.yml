name: Renovate

# Config lives at .github/renovate.json (repository config discovery). No checkout
# step: Renovate clones via the API. RENOVATE_TOKEN instead of GITHUB_TOKEN because
# GITHUB_TOKEN-created PRs do not run CI; without the secret the job skips.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: "Renovate · dependency updates"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
    steps:
      - name: "Notice: RENOVATE_TOKEN is not configured"
        if: env.RENOVATE_TOKEN == ''
        run: |
          echo "::notice::Skipping Renovate — the RENOVATE_TOKEN repository secret is not set, so no dependency PRs are opened. Create a fine-grained PAT (contents: read/write, pull requests: read/write, workflows: read/write on this repository) and store it as the RENOVATE_TOKEN secret to enable the weekly run."

      # CLI pinned to the validated release; the regex manager in renovate.json tracks it.
      - name: "Renovate: self-hosted run"
        if: env.RENOVATE_TOKEN != ''
        uses: renovatebot/github-action@ebcbb513d07ead4d9c0c2139064301db05e84a3e # v46.3.15
        with:
          # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
          renovate-version: "44.261.1"
        env:
          LOG_LEVEL: info
          RENOVATE_REPOSITORIES: ${{ github.repository }}
