name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  commitlint:
    name: "Lint · commit message"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: "Validate PR title (conventional commits)"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bunx --bun commitlint --verbose

  test:
    name: "Test · Bun suite + lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Setup: install bun"
        uses: oven-sh/setup-bun@v2

      - name: "Setup: bun install"
        run: bun install --frozen-lockfile

      # Lint is advisory — tests are the real gate. If lint fails but tests pass, the build proceeds.
      - name: "Lint: biome (non-blocking)"
        continue-on-error: true
        run: bun x @biomejs/biome check src/

      - name: "Type-check: tsc"
        run: bun run tsc --noEmit

      - name: "Test: bun test"
        run: bun test --coverage --coverage-reporter text --coverage-reporter lcov

      - name: "Upload coverage to Coveralls"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.COVERALLS_REPO_TOKEN }}
          file: ./coverage/lcov.info
