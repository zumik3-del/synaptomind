name: Continuous Integration
on:
  pull_request:

jobs:
  commitlint:
    name: "Lint · commit message"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: "Validate PR title (conventional commits)"
        run: bunx --bun commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  test:
    name: "Test · Bun suite + lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Setup: install bun"
        uses: oven-sh/setup-bun@v2

      - name: "Setup: bun install"
        run: bun install --frozen-lockfile

      # Lint is advisory — tests are the real gate. If lint fails but tests pass, the build proceeds.
      - name: "Lint: biome (non-blocking)"
        continue-on-error: true
        run: bun x @biomejs/biome check src/

      - name: "Type-check: tsc"
        run: bun run tsc --noEmit

      - name: "Test: bun test"
        run: bun test
