name: Continuous Integration
on:
  pull_request:

jobs:
  test:
    name: "Test · Bun suite + lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Setup: install bun"
        uses: oven-sh/setup-bun@v2

      - name: "Setup: bun install"
        run: bun install --frozen-lockfile

      # Lint is advisory — tests are the real gate. If lint fails but tests pass, the build proceeds.
      - name: "Lint: biome (non-blocking)"
        continue-on-error: true
        run: bun x @biomejs/biome check src/

      - name: "Type-check: tsc"
        run: bun run tsc --noEmit

      - name: "Test: bun test"
        run: bun test --coverage

      - name: "Upload coverage to Codecov"
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
