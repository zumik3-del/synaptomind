name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: "Lint · commit message"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # actions/checkout@v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: "Validate PR title (conventional commits)"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bunx --bun commitlint --verbose

  test:
    name: "Test · Bun suite + lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # actions/checkout@v5

      - name: "Setup: install bun"
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # oven-sh/setup-bun@v2

      - name: "Setup: bun install"
        run: bun install --frozen-lockfile

      # Lint is advisory — tests are the real gate. If lint fails but tests pass, the build proceeds.
      - name: "Lint: biome (non-blocking)"
        continue-on-error: true
        run: bun x @biomejs/biome check src/ eval/

      - name: "Type-check: tsc"
        run: bun run tsc --noEmit

      # The #1104 containment tests (deploy/state-isolation.test.ts) reproduce the
      # state-dir escape inside an unprivileged user namespace, and skip when the
      # runner cannot create one — silent coverage loss, which is the exact trap
      # they document. So: enable the capability, then PROVE it with the same flags
      # and marker the tests use, and fail the job if it is still unavailable.
      - name: "Setup: enable unprivileged user namespaces (gating for #1104 containment tests)"
        run: |
          set -euo pipefail

          # Mirrors USERNS_PROBE_ARGS / USERNS_PROBE_BODY / USERNS_PROBE_OK in
          # deploy/state-isolation.test.ts. A bare exit-status check is not enough:
          # an `unshare` that exits 0 having done nothing would pass while the tests
          # kept skipping. Only the uid=0 marker proves the namespace exists.
          USERNS_PROBE_OK='USERNS_PROBE_OK uid=0'
          USERNS_PROBE_ARGS=(
            --user
            --map-root-user
            --mount
            --propagation private
            sh -c 'printf "USERNS_PROBE_OK uid=%s\n" "$(id -u)"'
          )

          show_sysctls() {
            local key
            for key in kernel.unprivileged_userns_clone kernel.apparmor_restrict_unprivileged_userns; do
              if sysctl -n "$key" 2>/dev/null; then
                :
              else
                echo "$key: not present on this kernel"
              fi
            done
          }

          echo "::group::runner namespace configuration (before)"
          echo "uname -r: $(uname -r)"
          echo "probe: unshare ${USERNS_PROBE_ARGS[*]}"
          echo "probe marker: $USERNS_PROBE_OK"
          show_sysctls
          echo "::endgroup::"

          # A key the kernel does not have (kernel.unprivileged_userns_clone is a
          # RHEL patch, absent on Ubuntu) is reported, not fatal; the probe below is
          # the actual gate. ubuntu-latest 24.04 denies the uid_map write through
          # the AppArmor `unprivileged_userns` profile, so both are attempted.
          set_sysctl() {
            local key="$1" value="$2"
            if ! sysctl -n "$key" >/dev/null 2>&1; then
              echo "sysctl $key is not present on this kernel; nothing to set"
              return 0
            fi
            if sudo sysctl -w "$key=$value"; then
              echo "set $key=$value"
            else
              echo "::warning::could not set $key=$value; the probe decides whether the capability exists"
            fi
          }

          set_sysctl kernel.unprivileged_userns_clone 1
          set_sysctl kernel.apparmor_restrict_unprivileged_userns 0

          echo "::group::runner namespace configuration (after)"
          show_sysctls
          echo "::endgroup::"

          if probe_out="$(unshare "${USERNS_PROBE_ARGS[@]}" 2>&1)"; then
            probe_status=0
          else
            probe_status=$?
          fi

          echo "::group::user namespace probe"
          echo "exit status: $probe_status"
          echo "output:"
          printf '%s\n' "$probe_out"
          echo "::endgroup::"

          if [ "$probe_status" -ne 0 ] || ! printf '%s\n' "$probe_out" | grep -qxF "$USERNS_PROBE_OK"; then
            echo "::error::RUNNER ENVIRONMENT REGRESSION — unprivileged user namespaces are still unavailable on this runner. NOT a product failure and NOT a test failure. The two 'deploy state-dir containment (#1104)' tests in deploy/state-isolation.test.ts would silently SKIP (their describe name gains a 'SKIPPED, NOT RUN' suffix), so the #1104 state-dir escape would go unmeasured. See CI run 37318719080 for the original denial: unshare: write failed /proc/self/uid_map: Operation not permitted. Tried: sudo sysctl -w kernel.unprivileged_userns_clone=1 and sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0. If a runner image change caused this, fix the runner or the AppArmor/userns policy — do NOT relax the guard in the test file."
            exit 1
          fi

          echo "unprivileged user namespaces available: marker '$USERNS_PROBE_OK' observed with exit status 0"

      - name: "Test: bun test"
        run: bun test --coverage --coverage-reporter text --coverage-reporter lcov

      - name: "Eval: retrieval quality gate (deterministic)"
        run: bun run eval

      - name: "Upload coverage to Coveralls"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.COVERALLS_REPO_TOKEN }}
          file: ./coverage/lcov.info

  smoke:
    name: "Smoke · release artifact MCP round-trip"
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # actions/checkout@v5

      - name: "Setup: install bun"
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # oven-sh/setup-bun@v2

      - name: "Setup: bun install"
        run: bun install --frozen-lockfile

      - name: "Smoke: MCP tools/list + memory_store + memory_recall"
        run: bun run smoke

  docker-build:
    name: "Build · Docker image"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # actions/checkout@v5

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VERSION=ci-build \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            -t synaptomind:ci-build \
            .
