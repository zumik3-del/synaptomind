name: Security Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"
      - "Dockerfile"
      - "docker-compose*.yml"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"
      - "Dockerfile"
      - "docker-compose*.yml"
      - ".github/workflows/security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-container:
    name: Container Security Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t synaptomind:security-scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "synaptomind:security-scan"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

  trivy-config:
    name: IaC Security Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy for Dockerfile/IaC
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "config"
          scan-ref: "."
          format: "sarif"
          output: "trivy-config-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Upload Trivy config results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-config-results.sarif') != ''
        with:
          sarif_file: trivy-config-results.sarif
          category: trivy-config

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Trivy dependency scan
        id: trivy-deps
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "json"
          output: "trivy-deps-results.json"
          severity: "CRITICAL,HIGH"
          skip-dirs: "node_modules"

      - name: Parse Trivy dependency results
        id: parse-deps
        if: always()
        run: |
          if [ ! -f trivy-deps-results.json ]; then
            echo "vulnerabilities_found=false" >> "$GITHUB_OUTPUT"
            echo "No Trivy output found"
            exit 0
          fi

          COUNT=$(cat trivy-deps-results.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          results = data.get('Results', [])
          vulns = 0
          for r in results:
              for v in r.get('Vulnerabilities', []):
                  vulns += 1
          print(vulns)
          " 2>/dev/null || echo "0")

          echo "vuln_count=$COUNT" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -gt 0 ]; then
            echo "vulnerabilities_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "vulnerabilities_found=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Found $COUNT vulnerabilities"

      - name: Upload dependency scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-results
          path: trivy-deps-results.json
          retention-days: 30

      - name: Create or close dependency security issue
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,automated'
            });
            const existingIssue = existingIssues.data.find(i =>
              i.title.startsWith('Security Alert:') && i.title.includes('dependency')
            );

            if ('${{ steps.parse-deps.outputs.vulnerabilities_found }}' !== 'true') {
              if (existingIssue) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existingIssue.number,
                  body: 'All dependency vulnerabilities have been resolved. Closing automatically.'
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existingIssue.number,
                  state: 'closed'
                });
                console.log(`Auto-closed resolved issue #${existingIssue.number}`);
              }
              return;
            }

            let results;
            try {
              results = JSON.parse(fs.readFileSync('trivy-deps-results.json', 'utf8'));
            } catch {
              console.log('Could not read audit results');
              return;
            }

            let table = '| Package | Severity | Vulnerability | Fix Version |\n';
            table += '|---------|----------|---------------|-------------|\n';

            for (const r of (results.Results || [])) {
              for (const v of (r.Vulnerabilities || [])) {
                table += `| ${v.PkgName} | ${v.Severity} | ${v.VulnerabilityID} | ${v.FixedVersion || 'N/A'} |\n`;
              }
            }

            const vulnCount = '${{ steps.parse-deps.outputs.vuln_count }}';
            const title = `Security Alert: ${vulnCount} dependency vulnerabilities found`;

            const body = `## Automated Security Audit Results

            The weekly security audit found vulnerabilities in project dependencies.

            ${table}

            ### Recommended Actions

            1. Review each vulnerability
            2. Update affected packages: \`bun update <package>\`
            3. Run \`bunx trivy fs .\` locally to verify fixes

            ---
            *This issue was automatically created by the security audit workflow.*`;

            if (existingIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: body
              });
              console.log(`Updated existing issue #${existingIssue.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['security', 'automated', 'dependencies']
              });
              console.log('Created new security issue');
            }
