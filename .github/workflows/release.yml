name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: "Detect · version bump"
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      prev_tag: ${{ steps.check.outputs.prev_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve versions
        id: check
        shell: bash
        run: |
          NEW_SHA="${{ github.sha }}"
          BEFORE="${{ github.event.before }}"

          get_pkg_version() {
            local sha="$1"
            git show "${sha}:package.json" 2>/dev/null \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('version',''))" \
              || true
          }

          NEW_VERSION=$(get_pkg_version "$NEW_SHA")
          if [ -z "$NEW_VERSION" ]; then
            echo "No version found at $NEW_SHA — not a release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            return
          fi

          PREV_VERSION=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            PREV_VERSION=$(get_pkg_version "$BEFORE")
          fi

          TAG="v${NEW_VERSION}"

          # Check whether the tag already exists in the repo
          EXISTING=$(git tag -l "$TAG")
          TAG_EXISTS=false
          if [ -n "$EXISTING" ]; then
            TAG_EXISTS=true
          fi

          # Prerelease: version string contains '-'
          PRERELEASE=false
          if [[ "$NEW_VERSION" == *-* ]]; then
            PRERELEASE=true
          fi

          # Only release when version changed AND tag does not exist
          SHOULD_RELEASE=false
          if [ "$NEW_VERSION" != "$PREV_VERSION" ] && [ "$TAG_EXISTS" = "false" ]; then
            SHOULD_RELEASE=true
          fi

          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Output previous tag for release notes
          if [ -n "$PREV_VERSION" ]; then
            echo "prev_tag=v${PREV_VERSION}" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch: derive prev tag from most recent existing tag
            # excluding the new tag itself
            PREV_TAG=$(git tag --sort=-creatordate | grep -Fxv "${TAG}" | head -1 || true)
            echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: "Verify · CI gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # actions/checkout@v5

      - name: "Setup: install bun"
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # oven-sh/setup-bun@v2

      - name: "Setup: bun install"
        run: bun install --frozen-lockfile

      - name: "Type-check: tsc"
        run: bun run tsc --noEmit

      - name: "Test: bun test"
        run: bun test

  release:
    needs: [detect, verify]
    if: ${{ needs.detect.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build Release Notes
        id: notes
        shell: bash
        run: |
          TAG="${{ needs.detect.outputs.tag }}"
          PREV_TAG="${{ needs.detect.outputs.prev_tag }}"
          REPO="${{ github.repository }}"
          COMMIT_FMT="- [\`%h\`](https://github.com/${REPO}/commit/%H): %s"

          TMP=$(mktemp)
          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..${{ github.sha }}" --no-merges --pretty="$COMMIT_FMT" > "$TMP"
          else
            git log ${{ github.sha }} --no-merges --pretty="$COMMIT_FMT" > "$TMP"
          fi

          FEATURES=$(grep -i '^-.*: *feat[:(]' "$TMP" || true)
          FIXES=$(grep -i '^-.*: *fix[:(]' "$TMP" || true)
          OTHER=$(grep -iv '^-.*: *feat[:(]\|^-.*: *fix[:(]' "$TMP" || true)

          {
            if [ -n "$FEATURES" ]; then
              echo "### Features"
              echo "$FEATURES"
              echo
            fi
            if [ -n "$FIXES" ]; then
              echo "### Fixes"
              echo "$FIXES"
              echo
            fi
            if [ -n "$OTHER" ]; then
              echo "### Other"
              echo "$OTHER"
              echo
            fi
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Diff**: https://github.com/${REPO}/compare/${PREV_TAG}...${TAG}"
            fi
          } > RELEASE_NOTES.md

          rm -f "$TMP"
          echo "Generated release notes:"
          cat RELEASE_NOTES.md
          echo "RELEASE_NOTES_PATH=${{ runner.temp }}/RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Create annotated tag
        run: |
          TAG="${{ needs.detect.outputs.tag }}"
          if git tag -l "$TAG" | grep -q .; then
            echo "Tag $TAG already exists — skipping creation"
          else
            git tag -a "$TAG" -m "Release $TAG" "${{ github.sha }}"
            git push origin "$TAG"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        run: |
          TAG="${{ needs.detect.outputs.tag }}"
          if gh release view "$TAG" --json id 2>/dev/null | grep -q '"id"'; then
            echo "Release $TAG already exists — skipping creation"
          else
            PRERELEASE_FLAG=()
            if [ "${{ needs.detect.outputs.prerelease }}" = "true" ]; then
              PRERELEASE_FLAG+=(--prerelease)
            fi
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file RELEASE_NOTES.md \
              "${PRERELEASE_FLAG[@]}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docker:
    # Secondary job — does not gate the canonical GitHub Release.
    # The supported install path is the deploy/ framework (deploy/install.sh / deploy/update.sh).
    # The container image is provided as a convenience only.
    needs: [detect, verify]
    if: ${{ needs.detect.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # actions/checkout@v5

      - name: Get version from detect output
        id: version
        run: |
          echo "version=${{ needs.detect.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Detect prerelease
        id: prerelease
        run: |
          if [ "${{ needs.detect.outputs.prerelease }}" = "true" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute Docker tags
        id: docker-tags
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REPO="ghcr.io/${{ github.repository }}"
          TAGS="${REPO}:${VERSION}"
          if [ "${{ steps.prerelease.outputs.prerelease }}" = "false" ]; then
            TAGS=$(printf '%s\n%s' "$TAGS" "${REPO}:latest")
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # docker/build-push-action@v5
        with:
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT_SHA=${{ github.sha }}

  publish-tarball:
    # ADR 0001 §2.1/§2.7/§3.1 — the self-contained tarball as a release asset.
    #
    # PLATFORM MATRIX: linux-x86_64 only, one native ubuntu-latest runner.
    # onnxruntime-node cannot be cross-compiled and Bun's --target does not
    # cross-compile native addons, so there is deliberately NO `strategy.matrix`
    # and no --target here. Widening it means adding a native arm64 runner
    # (v2); the packer fails closed on any other uname.
    #
    # NON-GATING, like publish-docker: nothing in this job can block or fail
    # the canonical GitHub Release. It depends on `release` (the asset needs a
    # Release to attach to), never the other way round.
    needs: [detect, verify, release]
    if: ${{ needs.detect.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # actions/checkout@v5

      - name: "Setup: install bun"
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # oven-sh/setup-bun@v2

      - name: "Setup: bun install"
        run: bun install --frozen-lockfile

      - name: "Setup: vec0.so (checksum-verified download)"
        # bun install already runs this via postinstall; the explicit call keeps
        # the vec0 dependency visible in the job and covers --ignore-scripts.
        run: bash scripts/setup-vec0.sh

      - name: Compile the executable
        run: bun run scripts/build-binary.ts

      - name: Stage and pack the release tarball
        id: pack
        run: |
          bun run scripts/build-tarball.ts
          cat dist/asset.env >> "$GITHUB_OUTPUT"

      - name: Verify the asset unpacks cleanly
        # The packer already gates on this; repeated here so the run log carries
        # the listing and the version output of the exact file being uploaded.
        env:
          ASSET: ${{ steps.pack.outputs.ASSET_NAME }}
          ROOT_DIR: ${{ steps.pack.outputs.ROOT_DIR }}
        run: |
          tar -tzvf "dist/$ASSET"
          DEST="$RUNNER_TEMP/unpack"
          rm -rf "$DEST"; mkdir -p "$DEST"
          tar -xzf "dist/$ASSET" -C "$DEST" --no-same-owner
          ls -la "$DEST/$ROOT_DIR" "$DEST/$ROOT_DIR/lib"
          BIN="$DEST/$ROOT_DIR/synaptomind"
          "$BIN" --version

      - name: Upload the tarball to the GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: ${{ steps.pack.outputs.ASSET_NAME }}
        run: |
          TAG="${{ needs.detect.outputs.tag }}"
          gh release upload "$TAG" "dist/$ASSET" --clobber
          echo "https://github.com/${{ github.repository }}/releases/download/$TAG/$ASSET"

      - name: Record the asset size in the run summary
        env:
          ASSET: ${{ steps.pack.outputs.ASSET_NAME }}
          ASSET_BYTES: ${{ steps.pack.outputs.ASSET_BYTES }}
          UNPACKED_BYTES: ${{ steps.pack.outputs.UNPACKED_BYTES }}
          PLATFORM: ${{ steps.pack.outputs.PLATFORM }}
        run: |
          {
            echo "### Release tarball (ADR 0001 §2.1)"
            echo
            echo "| asset | platform | tar.gz | unpacked (required set) |"
            echo "|---|---|---|---|"
            echo "| \`$ASSET\` | \`$PLATFORM\` | $ASSET_BYTES B | $UNPACKED_BYTES B |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record the asset size in the release notes
        # ADR §2.1: the real compressed size must be recorded in the release
        # notes — the epic's "~90 MB" counted the executable alone. Guarded by a
        # marker so a re-run appends nothing.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: ${{ steps.pack.outputs.ASSET_NAME }}
          ASSET_BYTES: ${{ steps.pack.outputs.ASSET_BYTES }}
          UNPACKED_BYTES: ${{ steps.pack.outputs.UNPACKED_BYTES }}
          PLATFORM: ${{ steps.pack.outputs.PLATFORM }}
        run: |
          TAG="${{ needs.detect.outputs.tag }}"
          MARKER='<!-- synaptomind-tarball-asset -->'
          REL=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG")
          BODY=$(printf '%s' "$REL" | jq -r '.body // ""')
          if printf '%s' "$BODY" | grep -qF "$MARKER"; then
            echo "asset size already recorded in the notes for $TAG — nothing to do"
            exit 0
          fi
          MIB=$(awk -v b="$ASSET_BYTES" 'BEGIN { printf "%.1f", b / 1024 / 1024 }')
          SECTION=$(printf '\n%s\n### Installable release artifact\n\n`%s` — %s bytes (%s MiB) compressed; %s bytes unpacked. Platform: `%s`. Install with `bash deploy/install.sh`.\n' \
            "$MARKER" "$ASSET" "$ASSET_BYTES" "$MIB" "$UNPACKED_BYTES" "$PLATFORM")
          gh api --method PATCH "repos/${{ github.repository }}/releases/$(printf '%s' "$REL" | jq -r '.id')" \
            -f body="${BODY}${SECTION}" >/dev/null
          echo "recorded the asset size in the release notes for $TAG"
