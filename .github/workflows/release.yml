name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: "Detect · version bump"
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      prev_tag: ${{ steps.check.outputs.prev_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve versions
        id: check
        shell: bash
        run: |
          NEW_SHA="${{ github.sha }}"
          BEFORE="${{ github.event.before }}"

          get_pkg_version() {
            local sha="$1"
            git show "${sha}:package.json" 2>/dev/null \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('version',''))" \
              || true
          }

          NEW_VERSION=$(get_pkg_version "$NEW_SHA")
          if [ -z "$NEW_VERSION" ]; then
            echo "No version found at $NEW_SHA — not a release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            return
          fi

          PREV_VERSION=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            PREV_VERSION=$(get_pkg_version "$BEFORE")
          fi

          TAG="v${NEW_VERSION}"

          # Check whether the tag already exists in the repo
          EXISTING=$(git tag -l "$TAG")
          TAG_EXISTS=false
          if [ -n "$EXISTING" ]; then
            TAG_EXISTS=true
          fi

          # Prerelease: version string contains '-'
          PRERELEASE=false
          if [[ "$NEW_VERSION" == *-* ]]; then
            PRERELEASE=true
          fi

          # Only release when version changed AND tag does not exist
          SHOULD_RELEASE=false
          if [ "$NEW_VERSION" != "$PREV_VERSION" ] && [ "$TAG_EXISTS" = "false" ]; then
            SHOULD_RELEASE=true
          fi

          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Output previous tag for release notes
          if [ -n "$PREV_VERSION" ]; then
            echo "prev_tag=v${PREV_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "prev_tag=" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: "Verify · CI gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # actions/checkout@v5

      - name: "Setup: install bun"
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # oven-sh/setup-bun@v2

      - name: "Setup: bun install"
        run: bun install --frozen-lockfile

      - name: "Type-check: tsc"
        run: bun run tsc --noEmit

      - name: "Test: bun test"
        run: bun test

  release:
    needs: [detect, verify]
    if: ${{ needs.detect.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build Release Notes
        id: notes
        shell: bash
        run: |
          TAG="${{ needs.detect.outputs.tag }}"
          PREV_TAG="${{ needs.detect.outputs.prev_tag }}"
          REPO="${{ github.repository }}"
          COMMIT_FMT="- [\`%h\`](https://github.com/${REPO}/commit/%H): %s"

          TMP=$(mktemp)
          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..${{ github.sha }}" --no-merges --pretty="$COMMIT_FMT" > "$TMP"
          else
            git log ${{ github.sha }} --no-merges --pretty="$COMMIT_FMT" > "$TMP"
          fi

          FEATURES=$(grep -i '^-.*: *feat[:(]' "$TMP" || true)
          FIXES=$(grep -i '^-.*: *fix[:(]' "$TMP" || true)
          OTHER=$(grep -iv '^-.*: *feat[:(]\|^-.*: *fix[:(]' "$TMP" || true)

          {
            if [ -n "$FEATURES" ]; then
              echo "### Features"
              echo "$FEATURES"
              echo
            fi
            if [ -n "$FIXES" ]; then
              echo "### Fixes"
              echo "$FIXES"
              echo
            fi
            if [ -n "$OTHER" ]; then
              echo "### Other"
              echo "$OTHER"
              echo
            fi
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Diff**: https://github.com/${REPO}/compare/${PREV_TAG}...${TAG}"
            fi
          } > RELEASE_NOTES.md

          rm -f "$TMP"
          echo "Generated release notes:"
          cat RELEASE_NOTES.md
          echo "RELEASE_NOTES_PATH=${{ runner.temp }}/RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Create annotated tag
        run: |
          TAG="${{ needs.detect.outputs.tag }}"
          if git tag -l "$TAG" | grep -q .; then
            echo "Tag $TAG already exists — skipping creation"
          else
            git tag -a "$TAG" -m "Release $TAG" "${{ github.sha }}"
            git push origin "$TAG"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        run: |
          TAG="${{ needs.detect.outputs.tag }}"
          if gh release view "$TAG" --json id 2>/dev/null | grep -q '"id"'; then
            echo "Release $TAG already exists — skipping creation"
          else
            PRERELEASE_FLAG=()
            if [ "${{ needs.detect.outputs.prerelease }}" = "true" ]; then
              PRERELEASE_FLAG+=(--prerelease)
            fi
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file RELEASE_NOTES.md \
              "${PRERELEASE_FLAG[@]}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docker:
    # Secondary job — does not gate the canonical GitHub Release.
    # The supported install path is the deploy/ framework (deploy/install.sh / deploy/update.sh).
    # The container image is provided as a convenience only.
    needs: [detect, verify]
    if: ${{ needs.detect.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # actions/checkout@v5

      - name: Get version from detect output
        id: version
        run: |
          echo "version=${{ needs.detect.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Detect prerelease
        id: prerelease
        run: |
          if [ "${{ needs.detect.outputs.prerelease }}" = "true" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute Docker tags
        id: docker-tags
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REPO="ghcr.io/${{ github.repository }}"
          TAGS="${REPO}:${VERSION}"
          if [ "${{ steps.prerelease.outputs.prerelease }}" = "false" ]; then
            TAGS=$(printf '%s\n%s' "$TAGS" "${REPO}:latest")
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # docker/build-push-action@v5
        with:
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
