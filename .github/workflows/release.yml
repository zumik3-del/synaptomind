name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: prerelease
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Release Notes
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -Fxv "$TAG" | head -n 1 || true)
          REPO="${{ github.repository }}"
          COMMIT_FMT="- [\`%h\`](https://github.com/${REPO}/commit/%H): %s"

          TMP=$(mktemp)
          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..${TAG}" --no-merges --pretty="$COMMIT_FMT" | grep -v CHANGELOG > "$TMP"
          else
            git log "$TAG" --no-merges --pretty="$COMMIT_FMT" | grep -v CHANGELOG > "$TMP"
          fi

          FEATURES=$(grep -i '^-.*: *feat[:(]' "$TMP" || true)
          FIXES=$(grep -i '^-.*: *fix[:(]' "$TMP" || true)
          OTHER=$(grep -iv '^-.*: *feat[:(]\|^-.*: *fix[:(]' "$TMP" || true)

          {
            if [ -n "$FEATURES" ]; then
              echo "### Features"
              echo "$FEATURES"
              echo
            fi
            if [ -n "$FIXES" ]; then
              echo "### Fixes"
              echo "$FIXES"
              echo
            fi
            if [ -n "$OTHER" ]; then
              echo "### Other"
              echo "$OTHER"
              echo
            fi
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Diff**: https://github.com/${REPO}/compare/${PREV_TAG}...${TAG}"
            fi
          } > RELEASE_NOTES.md

          rm -f "$TMP"
          echo "Generated release notes:"
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        run: |
          PRERELEASE_FLAG=()
          if [ "${{ steps.prerelease.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG+=(--prerelease)
          fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            "${PRERELEASE_FLAG[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute Docker tags
        id: docker-tags
        run: |
          TAGS="ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}"
          if [ "${{ steps.prerelease.outputs.prerelease }}" = "false" ]; then
            TAGS=$(printf '%s\n%s' "$TAGS" "ghcr.io/${{ github.repository }}:latest")
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
