name: Eval · real embedder

on:
  schedule:
    # Weekly check for real-embedder regressions. Does not run on PRs/pushes;
    # the deterministic gate lives in ci.yml (task #891).
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-real-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-real:
    name: "Eval · real (weekly)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Setup: install bun"
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: "Setup: bun install"
        run: bun install --frozen-lockfile

      - name: Cache HuggingFace model (~465M)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: data/huggingface/Xenova/multilingual-e5-small
          key: hf-model-multilingual-e5-small-${{ runner.os }}
          restore-keys: |
            hf-model-multilingual-e5-small-

      - name: "Eval: real embedder baseline gate"
        run: bun run eval --real

  # Regression net for #2683. The `smoke` job in ci.yml runs `bun run smoke`,
  # i.e. from source, so nothing in CI ever started a COMPILED binary's
  # `--embedder` child. v0.26.5 shipped that way and a binary install answered
  # checks.embedder = "failed" ("Cannot find package 'onnxruntime-node' from
  # '/$bunfs/root/synaptomind'"), so prod (LXC 117) had to be rolled back. This
  # job packs the release tarball exactly as release.yml does, boots the
  # unpacked artifact against a scratch dir and a fresh DB, and fails unless
  # /health reports checks.embedder = "ok" within a bounded wait.
  #
  # Lives here, not in ci.yml: this is the heavy gate's cadence (weekly +
  # workflow_dispatch, never on a PR) and the HuggingFace cache below already
  # exists here, so the artifact boots against the cached model instead of
  # downloading 465 MB again. ci.yml's `on:` has no `dev` branch, and adding
  # one would change the triggers of every job it already has.
  artifact-embedder:
    name: "Artifact · compiled binary boots its embedder (weekly)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Setup: install bun"
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: "Setup: bun install"
        run: bun install --frozen-lockfile

      # Same key as the eval job above, so the two jobs share one cache entry:
      # the artifact's embedder validates the model files and never downloads.
      - name: Cache HuggingFace model (~465M)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: data/huggingface/Xenova/multilingual-e5-small
          key: hf-model-multilingual-e5-small-${{ runner.os }}
          restore-keys: |
            hf-model-multilingual-e5-small-

      # Same step as release.yml: the verified download that ends up as vec0.so
      # beside the executable (bun install's postinstall does it too; the
      # explicit call keeps the dependency visible and covers --ignore-scripts).
      - name: "Setup: vec0.so (checksum-verified download)"
        run: bash scripts/setup-vec0.sh

      - name: Compile the executable
        run: bun run build:binary

      - name: Stage and pack the release tarball
        id: pack
        run: |
          bun run scripts/build-tarball.ts
          cat dist/asset.env >> "$GITHUB_OUTPUT"

      - name: "Boot: artifact /health must report checks.embedder = ok"
        env:
          ASSET: ${{ steps.pack.outputs.ASSET_NAME }}
        run: bun run scripts/artifact-health-check.ts "dist/$ASSET"
